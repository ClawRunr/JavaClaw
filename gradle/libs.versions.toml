[versions]
spring-boot = "4.2.0"
spring-ai = "2.1.0"
telegrambots = "9.5.0"
commonmark = "0.28.0"
archunit = "1.4.2"
vaadin = "25.3.5"

[libraries]
bom-spring-boot = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
bom-spring-ai = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
bom-spring-modulith = { module = "org.springframework.modulith:spring-modulith-bom", version = "2.2.0" }
bom-vaadin = { module = "com.vaadin:vaadin-bom", version.ref = "vaadin" }
vaadin-spring-boot-starter = { module = "com.vaadin:vaadin-spring-boot-starter" }
spring-ai-agent-utils = { module = "org.springaicommunity:spring-ai-agent-utils", version = "0.9.0" }
spring-ai-lucene = { module = "org.apache.lucene:lucene-core", version = "9.12.3" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

netty-resolver-dns-native-macos = { module = "io.netty:netty-resolver-dns-native-macos", version = "4.2.12.Final" }
jobrunr-spring-starter = { module = "org.jobrunr:jobrunr-spring-boot-4-starter", version = "8.6.1" }
pebble-spring-starter = { module = "io.pebbletemplates:pebble-spring-boot-starter", version = "4.1.1" }
java-discord-api = { module = "net.dv8tion:JDA", version = "6.4.1" }
playwright = { module = "com.microsoft.playwright:playwright", version = "1.65.1" }
telegrambots-client = { module = "org.telegram:telegrambots-client", version.ref = "telegrambots" }
telegrambots-springboot-longpolling-starter = { module = "org.telegram:telegrambots-springboot-longpolling-starter", version.ref = "telegrambots" }
commonmark-java = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version = "10.9.1" }

webjars-locator-lite = { module = "org.webjars:webjars-locator-lite" }
webjars-marked = { module = "org.webjars.npm:marked", version = "18.2.0" }
webjars-dompurify = { module = "org.webjars.npm:dompurify", version = "3.4.18" }
webjars-font-inter = { module = "org.webjars.npm:fontsource__inter", version = "5.2.8" }
webjars-font-jetbrains-mono = { module = "org.webjars.npm:fontsource__jetbrains-mono", version = "5.3.0" }
webjars-htmx = { module = "org.webjars.npm:htmx.org", version = "2.0.8" }
webjars-htmx-ext-ws = { module = "org.webjars.npm:htmx-ext-ws", version = "2.0.2" }
webjars-bulma = { module = "org.webjars.npm:bulma", version = "1.0.4" }
webjars-bulma-timeline = { module = "org.webjars.npm:bulma-timeline", version = "3.0.4" }

[bundles]


[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
jib = { id = "com.google.cloud.tools.jib", version = "3.5.3" }
vaadin = { id = "com.vaadin", version.ref = "vaadin" }