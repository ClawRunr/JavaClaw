spring:
  application:
    name: JavaClaw
  config:
    import: optional:classpath:application.private.yaml
  datasource:
    url: jdbc:h2:file:./workspace/app
  ai:
    model:
      chat: unknown
      audio.speech: unknown
      audio.transcription: unknown
      embedding: unknown
      image: unknown
      moderation: unknown

management:
  endpoint:
    restart:
      enabled: true

pebble:
  suffix: .html.peb
agent:
  onboarding:
    completed: false
  workspace: file:./workspace/
  skills:
    paths: classpath:/META-INF/skills
  channels:
    teams:
      enabled: true
      app-id: "00000000-0000-0000-0000-000000000001"
      app-secret: "dummy-secret"
      tenant-id: "00000000-0000-0000-0000-000000000002"
      # allowed-user-id: ""
jobrunr:
  background-job-server:
    enabled: true
    worker-count: 1
  dashboard:
    enabled: true
    port: 8081
