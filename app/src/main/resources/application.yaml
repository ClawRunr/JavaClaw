spring:
  application:
    name: JavaClaw
  config:
    # The file ConfigurationManager writes, so the in-process restart after a change reads it.
    import: optional:file:./app/src/main/resources/application.private.yaml
  datasource:
    url: jdbc:h2:file:./workspace/app
  ai:
    model:
      chat: unknown
      audio.speech: unknown
      audio.transcription: unknown
      embedding: unknown
      image: unknown
      moderation: unknown

management:
  endpoint:
    restart:
      enabled: true

vaadin:
  # Keeps Vaadin off the context root, where IndexController redirects to the HTMX chat.
  url-mapping: /ui/*
  # Scan only our own packages for routes; scanning the whole classpath slows startup noticeably.
  allowed-packages: ai.javaclaw

pebble:
  suffix: .html.peb
agent:
  onboarding:
    completed: false
  workspace: file:./workspace/
  skills:
    paths: classpath:/META-INF/skills
  # Tool approval: tools in allow run, every other call pauses the turn until it is approved or denied.
  # Nobody to ask: denied. Don't add tools that write or run commands to allow.
  approval:
    allow:
      - Read
      - Skill
      - toolSearchTool
      - CheckListTool
      - listRecurringTasks
      - getText
      - waitForSelector
      - closeBrowser
      - takeScreenshot
      - Glob
      - Grep
      - ListDirectory
      - BashOutput
      - TodoWrite
      - MemoryView
jobrunr:
  background-job-server:
    enabled: true
    worker-count: 1
  dashboard:
    enabled: true
    port: 8081
