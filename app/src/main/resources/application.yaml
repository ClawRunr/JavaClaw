spring:
  application:
    name: JavaClaw
  config:
    # ConfigurationManager writes onboarding/settings changes to the source file; it is imported last so the
    # in-process restart after a change sees it (the classpath copy is only refreshed by a rebuild).
    import:
      - optional:classpath:application.private.yaml
      - optional:file:./app/src/main/resources/application.private.yaml
  datasource:
    url: jdbc:h2:file:./workspace/app
  ai:
    model:
      chat: unknown
      audio.speech: unknown
      audio.transcription: unknown
      embedding: unknown
      image: unknown
      moderation: unknown

management:
  endpoint:
    restart:
      enabled: true

vaadin:
  # Keeps Vaadin off the context root, where IndexController redirects to the HTMX chat.
  url-mapping: /ui/*
  # Scan only our own packages for routes; scanning the whole classpath slows startup noticeably.
  allowed-packages: ai.javaclaw

pebble:
  suffix: .html.peb
agent:
  onboarding:
    completed: false
  workspace: file:./workspace/
  skills:
    paths: classpath:/META-INF/skills
jobrunr:
  background-job-server:
    enabled: true
    worker-count: 1
  dashboard:
    enabled: true
    port: 8081
