spring:
  application:
    name: JavaClaw
  config:
    # The file ConfigurationManager writes, so the in-process restart after a change reads it.
    import: optional:file:./app/src/main/resources/application.private.yaml
  datasource:
    url: jdbc:h2:file:./workspace/app
  ai:
    model:
      chat: unknown
      audio.speech: unknown
      audio.transcription: unknown
      embedding: unknown
      image: unknown
      moderation: unknown

management:
  endpoint:
    restart:
      enabled: true

vaadin:
  # Keeps Vaadin off the context root, where IndexController redirects to the HTMX chat.
  url-mapping: /ui/*
  # Scan only our own packages for routes; scanning the whole classpath slows startup noticeably.
  allowed-packages: ai.javaclaw

pebble:
  suffix: .html.peb
agent:
  onboarding:
    completed: false
  workspace: file:./workspace/
  skills:
    paths: classpath:/META-INF/skills
  # Tool approval: deny -> protected path -> allow -> ask. A call that needs approval when nobody can be asked is denied.
  # Lists replace each other, so an override of allow in application.private.yaml must repeat what it keeps.
  approval:
    timeout: 2m
    # Run without asking
    allow:
      - Read
      - Skill
      - toolSearchTool
      - CheckListTool
      - listRecurringTasks
      - getText
      - waitForSelector
      - closeBrowser
      - takeScreenshot
      - Glob
      - Grep
      - ListDirectory
      - BashOutput
      - TodoWrite
      - MemoryView
    # Never run, and not offered to the model
    deny: []
    # Any call with an argument value pointing here, or mentioning one of these names, always asks.
    # The runtime config file is always protected. "workspace/" means agent.workspace; a trailing "/" means everything inside.
    protected-paths:
      - application*.yaml
      - application*.yml
      - application*.properties
      - workspace/conversations/
      - workspace/AGENT.md
      - workspace/INFO.md
      - workspace/skills/
      - workspace/agents/
jobrunr:
  background-job-server:
    enabled: true
    worker-count: 1
  dashboard:
    enabled: true
    port: 8081
