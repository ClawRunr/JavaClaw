plugins {
    id 'java-library'
    id 'org.springframework.boot'
    alias(libs.plugins.jib)
}

dependencies {
    implementation project(':base')
    implementation project(':providers:anthropic')
    implementation project(':providers:claude-code')
    implementation project(':providers:google')
    implementation project(':providers:ollama')
    implementation project(':providers:openai')

    implementation project(':plugins:discord')
    implementation project(':plugins:telegram')
    implementation project(':plugins:playwright')
    implementation project(':plugins:brave')
    implementation project(':plugins:whatsapp')
    implementation project(':plugins:teams')

    implementation project(':ui')

    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation(libs.pebble.spring.starter)

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // Runs from the IDE can pick up ui's development-mode build info, which needs Vaadin's dev server.
    // developmentOnly keeps it out of the boot jar and the Jib image, which stay in production mode.
    developmentOnly platform(libs.bom.vaadin)
    developmentOnly 'com.vaadin:vaadin-dev'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation libs.spring.modulith.starter.test
    testImplementation libs.archunit.junit5
}

bootRun {
    workingDir = rootProject.projectDir
}

jib {
    // Like bootJar, leave developmentOnly dependencies (devtools, vaadin-dev) out of the image
    configurationName = 'productionRuntimeClasspath'
    to {
        image = 'jobrunr.io/javaclaw'
        tags = ['latest']
    }
    extraDirectories {
        paths {
            path {
                from = rootProject.file('workspace')
                into = '/workspace'
            }
            permissions = [
                    '/workspace': '755'
            ]
        }
    }
}
