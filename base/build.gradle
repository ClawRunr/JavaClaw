plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id("com.skillsjars.gradle-plugin") version "0.0.2"
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation(libs.jobrunr.spring.starter)
    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.fasterxml.jackson.core:jackson-core'

    // No idea?
    runtimeOnly(libs.netty.resolver.dns.native.macos)

    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
    implementation 'org.springframework.ai:spring-ai-tool-search-advisor'
    implementation 'org.springframework.ai:spring-ai-tool-search-tool'
    implementation(libs.spring.ai.lucene)

    implementation(libs.spring.ai.agent.utils)

    // Session memory. The JDBC auto-configuration (and the starter that brings it) is left out on
    // purpose: it binds to the single DataSource bean, which is the one JobRunr uses.
    implementation 'org.springframework.ai:spring-ai-session-jdbc'
    implementation 'org.springframework.ai:spring-ai-session-advisor'
    implementation 'org.springframework.ai:spring-ai-autoconfigure-model-session'

    // The sessions database is opened directly, through H2's own connection pool
    implementation 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}
